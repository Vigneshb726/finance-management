# Render Blueprint: one Node web service (API + built React app, same origin) and a PostgreSQL database.
# Deploy: push this repo to GitHub, then in Render choose New → Blueprint and select the repo.
services:
  - type: web
    name: finora
    runtime: node
    plan: free
    buildCommand: >-
      npm ci --include=dev &&
      npm run build &&
      npm run db:deploy &&
      if [ "$SEED_DEMO_DATA" = "true" ]; then npm run db:seed; fi
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: finora-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      # "true" (re)creates the demo account on every deploy; set to "false" for real use
      - key: SEED_DEMO_DATA
        value: "true"

databases:
  - name: finora-db
    plan: free
    databaseName: finance_db
    user: finora
